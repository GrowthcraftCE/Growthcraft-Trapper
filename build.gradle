plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id "net.neoforged.gradle" version '[0.10,)'
    id "org.sonarqube" version "4.2.1.3168"
}

version = "${minecraft_version}-${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_archive_base}"
}

sonarqube {
    properties {
        property "sonar.projectKey", "Growthcraft-Trapper"
        property "sonar.organization", "growthcraftce"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('========================================')
println('Java: ' + System.getProperty('java.version'))
println(' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ')')
println('Arch: ' + System.getProperty('os.arch'))
println("Build Version: ${mod_version}")
println('----------------------------------------')

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            //mods {
            //    "${mod_id}" {
            //        source sourceSets.main
            //    }
            //}
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all'
            args '--output', file('src/main/resources/data')
            args '--existing', file('src/main/resources/data')
            args '--dev'
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.neoforged.net/snapshots/" }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraft:minecraft:${minecraft_version}'
    mappings 'net.minecraftforge:mappings:${mapping_channel}-${mapping_version}'
    modImplementation 'net.neoforged:neoforge:${forge_version}'
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1.20',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
