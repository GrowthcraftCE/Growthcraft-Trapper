plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
    id "org.sonarqube" version "4.2.1.3168"
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_archive_base}"
}

sonarqube {
    properties {
        property "sonar.projectKey", "GrowthcraftCE_Growthcraft-Trapper"
        property "sonar.organization", "growthcraftce"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('========================================')
println('Java: ' + System.getProperty('java.version'))
println(' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ')')
println('Arch: ' + System.getProperty('os.arch'))
println("Build Version: ${mod_version}")
println('----------------------------------------')

// --- NeoGradle / NeoForge config (replaces ForgeGradle minecraft { } + mappings deps) ---

repositories {
    mavenCentral()
    // (NeoForge/NeoGradle artifacts come from dependency metadata; keeping the NeoForged repos here is harmless)
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.neoforged.net/snapshots/" }
}

dependencies {
    // NeoGradle userdev: you only need NeoForge here
    implementation "net.neoforged:neoforge:${neo_version}"
}

// Runs are configured at top-level in NeoGradle
runs {
    configureEach { run ->
        run.workingDirectory = file("run")

        // attach your mod sources
        run.modSource sourceSets.main

        // logging options still work fine in NeoForge (same keys you were using)
        run.systemProperty "forge.logging.markers", "REGISTRIES"
        run.systemProperty "forge.logging.console.level", "debug"
    }

    client { }
    server { }

    data {
        arguments.addAll "--mod", mod_id, "--all",
                "--output", file("src/generated/resources").absolutePath,
                "--existing", file("src/main/resources").absolutePath
    }
}


repositories {
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.neoforged.net/snapshots/" }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,

            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]

    inputs.properties(replaceProperties)

    filesMatching(['META-INF/mods.toml']) {
        expand(replaceProperties)
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1.20',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
